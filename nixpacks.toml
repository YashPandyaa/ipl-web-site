[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "cd backend && pip install --upgrade pip setuptools wheel",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = ["cd backend && python manage.py migrate", "cd backend && python manage.py collectstatic --noinput"]

[start]
cmd = "cd backend && gunicorn ipl_project.wsgi --bind 0.0.0.0:$PORT"
